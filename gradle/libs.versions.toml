[versions]
# Revised again 2026-08 (see CHANGELOG 0.1.3) — 0.1.1's rollback overcorrected.
# The AGP 9.x problem was real, but compileSdk/Compose BOM never needed to
# drop with it: Haze/Cloudy/Compose Unstyled are all active 2026 libraries
# whose own transitive deps need compileSdk 36 regardless of what's pinned
# here directly, and Gradle's conflict resolution lets those transitive
# versions win anyway. This combination is Google-documented (Navigation
# SDK's compatibility table) as tested together, and AGP 8.10.0 predates
# AGP 9's DSL rewrite, so it avoids the original cast-exception problem too.
agp = "8.10.0"
kotlin = "2.2.10"
composeBom = "2026.06.00"
coreKtx = "1.17.0"                 # matches what actually resolves per the 0.1.2 build log
lifecycle = "2.9.4"                 # matches what actually resolves per the 0.1.2 build log
activityCompose = "1.12.2"          # matches what actually resolves per the 0.1.2 build log
composeUnstyled = "1.49.1"         # confirmed real on Maven Central at this exact coordinate+version
                                    # (com.composables:compose-unstyled). The modular per-component
                                    # artifacts (composeunstyled-theming etc.) used in 0.1.1 turned out
                                    # NOT to resolve at this version — see CHANGELOG 0.1.2. Falling back
                                    # to the one coordinate with actual confirmed evidence behind it.
haze = "1.7.2"                     # confirmed: latest stable (non-2.0-alpha) tag on chrisbanes/haze
cloudy = "0.6.1"                   # confirmed current on Skydoves/cloudy
coilCompose = "3.1.0"              # best-effort
kotlinxCoroutines = "1.9.0"        # best-effort
navigationCompose = "2.9.3"        # best-effort — androidx.navigation tends to track close to
                                    # androidx.lifecycle's release train, which resolved to 2.9.4
                                    # per the actual 0.1.2 build log, so this is an educated guess
                                    # rather than a blind one, but still unverified
junit = "4.13.2"                   # the standard runner; AGP's built-in test integration targets it

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }

# Compose Unstyled — headless components, no Material. Single monolithic
# artifact (confirmed to actually resolve — see CHANGELOG 0.1.2), not the
# modular per-component split 0.1.1 guessed at.
composeunstyled = { group = "com.composables", name = "compose-unstyled", version.ref = "composeUnstyled" }

# Blur — layered per plan §2: Haze everywhere, Cloudy for liquid-glass accents.
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-materials = { group = "dev.chrisbanes.haze", name = "haze-materials", version.ref = "haze" }
cloudy = { group = "com.github.skydoves", name = "cloudy", version.ref = "cloudy" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coilCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
